name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: release-npm
  cancel-in-progress: false

jobs:
  publish:
    name: Publish npm packages
    runs-on: ubuntu-latest
    environment: npm

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npm test

      - name: Publish changed packages
        run: |
          set -euo pipefail
          unset NODE_AUTH_TOKEN NPM_TOKEN

          packages=(
            "@talkincode/topox-core"
            "@talkincode/topox-dsl"
            "@talkincode/topox-editor"
            "@talkincode/topox-interop"
            "@talkincode/topox-embed"
            "@talkincode/topox-mcp"
          )

          for pkg in "${packages[@]}"; do
            version="$(
              npm pkg get version --workspace "$pkg" --json |
                node -e 'const fs = require("node:fs"); const pkg = process.argv[1]; const value = JSON.parse(fs.readFileSync(0, "utf8")); console.log(typeof value === "string" ? value : value[pkg]);' "$pkg"
            )"

            if npm view "$pkg@$version" version >/dev/null 2>&1; then
              echo "skip $pkg@$version: already published"
              continue
            fi

            npm publish --workspace "$pkg" --access public --provenance
          done

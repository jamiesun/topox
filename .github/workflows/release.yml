name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: release-npm
  cancel-in-progress: false

jobs:
  publish:
    name: Publish npm packages
    runs-on: ubuntu-latest
    environment: npm

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci
      - run: npm run build
      - run: npm test

      - name: Publish changed packages
        run: |
          set -euo pipefail

          packages=(
            "@talkincode/topox-core"
            "@talkincode/topox-dsl"
            "@talkincode/topox-editor"
            "@talkincode/topox-interop"
            "@talkincode/topox-embed"
          )

          for pkg in "${packages[@]}"; do
            version="$(npm pkg get version --workspace "$pkg" | tr -d '"')"

            if npm view "$pkg@$version" version >/dev/null 2>&1; then
              echo "skip $pkg@$version: already published"
              continue
            fi

            npm publish --workspace "$pkg" --access public --provenance
          done
